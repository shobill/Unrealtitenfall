; Developer GPU stability (SkySeoul.log: DXGI_ERROR_DEVICE_REMOVED / 887A002B DEVICE_HUNG
; during RTPSO + PathTracing compile, breadcrumb Slate). Remove or flip for shipping QA.

; Kill the RTPSO / Path Tracing compile storm that preceded the last GPU crash
r.RayTracing=0
r.RayTracing.Shadows=0
r.PathTracing=0
r.Lumen.HardwareRayTracing=0

; Slightly cheaper shadows while iterating (optional; comment out if you need VSM)
; r.Shadow.Virtual.Enable=0

; Next GPU crash: better breadcrumbs (small cost). Set to 0 if not needed.
r.GPUCrashDebugging=1
